<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b4334" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Kök çalış</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" />
  <link rel="stylesheet" href="./styles.css?v=10" />
</head>
<body>
  <div class="sticky-head">
    <header class="topbar">
      <p class="mark" id="brand">Kök</p>
      <div class="lang-switch" id="lang-switch">
        <button type="button" data-set-lang="tr" aria-label="Türkçe"><svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#e30a17"/><circle cx="12" cy="10" r="5" fill="#fff"/><circle cx="13.4" cy="10" r="4" fill="#e30a17"/><path fill="#fff" d="M19.2 10 17.9 10.9l.5-1.5-1.3-.9h1.6L19.2 7l.5 1.5h1.6l-1.3.9z"/></svg></button>
        <button type="button" data-set-lang="en" aria-label="English"><svg viewBox="0 0 60 30" aria-hidden="true"><defs><clipPath id="en-flag"><rect width="60" height="30"/></clipPath></defs><g clip-path="url(#en-flag)"><rect width="60" height="30" fill="#012169"/><path d="M0 0 60 30M60 0 0 30" stroke="#fff" stroke-width="8"/><path d="M0 0 60 30M60 0 0 30" stroke="#C8102E" stroke-width="4"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="12"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="7"/></g></svg></button>
      </div>
      <p id="count" class="meta">Yükleniyor…</p>
    </header>
    <label class="search">
      <span class="sr-only">Kök ara</span>
      <input id="q" type="search" enterkeyhint="search" placeholder="Anlam, harf veya ad" autocomplete="off" />
    </label>
    <nav class="seg" id="tabs">
      <button type="button" data-tab="sozluk" class="on" id="tab-sozluk">Sözlük</button>
      <button type="button" data-tab="fiiller" id="tab-fiiller">Fiiller</button>
      <button type="button" data-tab="isimler" id="tab-isimler">İsimler</button>
    </nav>
  </div>
  <main id="panel"></main>
  <p id="empty" class="empty hidden">Bu aramada kök yok.</p>
  <p id="error" class="error hidden"></p>
  <script type="module" src="./app.js?v=7"></script>
</body>
</html>
