<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f4c38" />
  <meta name="color-scheme" content="light dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Kök çalış</title>
  <link rel="manifest" href="./manifest.webmanifest?v=5" />
  <link rel="icon" href="./icon.svg?v=5" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=26" />
  <script>
    try {
      const saved = localStorage.getItem('kh-theme')
      const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : dark ? 'dark' : 'light'
    } catch (err) {
      document.documentElement.dataset.theme = 'light'
    }
  </script>
</head>
<body class="study-body">
  <div id="root"></div>
  <p id="error" class="error hidden"></p>
  <script type="module" src="./root.js?v=20"></script>
</body>
</html>
