    (function () {

      var inApp = /FBAN|FBAV|FB_IAB|FBIOS|Instagram|Line\/|Twitter|TikTok|Snapchat|WhatsApp|MessengerLite|Messenger/i.test(ua)

        if (inApp && /Android/i.test(ua)) {

        }
        if (inApp && /iPhone|iPad|iPod/i.test(ua)) {
          location.href = 'x-safari-' + url
          return
        }
        location.replace(url)
      }
      window.kokOpen = openApp
      if (!inApp) openApp()
    })()
